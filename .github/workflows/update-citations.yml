name: Update Citations and Publications

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly pyyaml

      - name: Sync ORCID publications
        run: |
          python bin/sync_orcid_publications.py

      - name: Update Google Scholar Citations
        run: |
          python bin/update_scholar_citations.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _data/citations.yml _bibliography/papers.bib || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update publications & citations [skip ci]"
            git push
          fi
